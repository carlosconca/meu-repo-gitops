# argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/carlosconca/meu-repo-gitops.git
    targetRevision: main
    path: apps/overlays/producao
  destination:
    server: https://kubernetes.default.svc
    namespace: producao
  syncPolicy:
    automated:
      prune: true       # remove recursos que saíram do Git
      selfHeal: true    # reverte mudanças manuais feitas fora do Git
    syncOptions:
      - CreateNamespace=true